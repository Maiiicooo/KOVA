<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KOVA — Spot Viewer</title>

    <style>
      :root {
        --bg: #151414;
        --panel: #1d1b1a;
        --panel2: #24211f;
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.58);
        --line: rgba(255, 255, 255, 0.1);
        --brown: #9a745b;
        --radius: 20px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .page {
        width: min(1700px, 100%);
        margin: 0 auto;
        padding: 26px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 44px);
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .sub {
        color: var(--muted);
        margin-top: 8px;
        font-size: 14px;
      }

      .count {
        font-size: 14px;
        color: var(--muted);
      }

      .count strong {
        color: white;
        font-size: 22px;
        margin-right: 5px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto;
        gap: 10px;
        padding: 11px;
        margin-bottom: 20px;
        background: rgba(21, 20, 20, 0.9);
        backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 17px;
      }

      input,
      select {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: white;
        padding: 0 14px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: rgba(154, 116, 91, 0.75);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 17px;
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        transition: 0.18s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.19);
      }

      .photo {
        aspect-ratio: 4/3;
        background: #0d0d0d;
        overflow: hidden;
        cursor: pointer;
        position: relative;
      }

      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .photo-count {
        position: absolute;
        top: 11px;
        right: 11px;
        border-radius: 999px;
        padding: 6px 9px;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 11px;
        backdrop-filter: blur(8px);
      }

      .no-photo {
        height: 100%;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.28);
        font-size: 13px;
      }

      .body {
        padding: 15px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .spot-name {
        margin: 0;
        font-size: 18px;
        line-height: 1.15;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
      }

      .type {
        flex: none;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 6px 8px;
        border-radius: 999px;
      }

      .description {
        margin: 9px 0 13px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        min-height: 19px;
      }

      .idbox {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 9px 10px;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 11px;
      }

      .id {
        min-width: 0;
        flex: 1;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.76);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .copy {
        flex: none;
        border: 0;
        border-radius: 8px;
        padding: 6px 9px;
        background: var(--brown);
        color: #fff;
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
      }

      .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 11px;
        color: var(--muted);
        font-size: 11px;
      }

      .meta span {
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .empty,
      .loading,
      .error {
        grid-column: 1/-1;
        padding: 50px;
        text-align: center;
        color: var(--muted);
      }

      .error {
        color: #e99595;
      }

      dialog {
        width: min(1000px, 94vw);
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #111;
        padding: 0;
        color: white;
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(5px);
      }

      .viewer {
        position: relative;
      }

      .viewer img {
        width: 100%;
        max-height: 82vh;
        object-fit: contain;
        display: block;
        background: #080808;
      }

      .viewer-controls {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 12px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
      }

      .viewer-controls button {
        pointer-events: auto;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.62);
        color: white;
        cursor: pointer;
      }

      .viewer-nav {
        position: absolute;
        top: 50%;
        left: 12px;
        right: 12px;
        transform: translateY(-50%);
        display: flex;
        justify-content: space-between;
        pointer-events: none;
      }

      .viewer-nav button {
        pointer-events: auto;
        width: 46px;
        height: 46px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.62);
        color: white;
        cursor: pointer;
        font-size: 22px;
      }

      @media (max-width: 1200px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .page {
          padding: 16px;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .toolbar {
          grid-template-columns: 1fr;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <header>
        <div>
          <h1>KOVA spots</h1>
          <div class="sub">Visual admin viewer — read only</div>
        </div>
        <div class="count"><strong id="visibleCount">0</strong> spots</div>
      </header>

      <section class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="Search name, ID, type, city..."
          autocomplete="off"
        />
        <select id="typeFilter">
          <option value="">All types</option>
        </select>
        <select id="sort">
          <option value="name">Name A–Z</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="rating">Highest rating</option>
        </select>
      </section>

      <section class="grid" id="grid">
        <div class="loading">Loading spots…</div>
      </section>
    </main>

    <dialog id="viewerDialog">
      <div class="viewer">
        <img id="viewerImage" alt="" />
        <div class="viewer-controls">
          <span></span>
          <button id="closeViewer" aria-label="Close">×</button>
        </div>
        <div class="viewer-nav">
          <button id="prevImage" aria-label="Previous">‹</button>
          <button id="nextImage" aria-label="Next">›</button>
        </div>
      </div>
    </dialog>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

      /*
      ======================================================
      PASTE THE SAME FIREBASE CONFIG AS YOUR KOVA WEBSITE HERE
      ======================================================
    */
      const firebaseConfig = {
        apiKey: "PASTE_HERE",
        authDomain: "PASTE_HERE",
        projectId: "PASTE_HERE",
        storageBucket: "PASTE_HERE",
        messagingSenderId: "PASTE_HERE",
        appId: "PASTE_HERE",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const grid = document.getElementById("grid");
      const search = document.getElementById("search");
      const typeFilter = document.getElementById("typeFilter");
      const sortSelect = document.getElementById("sort");
      const visibleCount = document.getElementById("visibleCount");

      const viewerDialog = document.getElementById("viewerDialog");
      const viewerImage = document.getElementById("viewerImage");
      const closeViewer = document.getElementById("closeViewer");
      const prevImage = document.getElementById("prevImage");
      const nextImage = document.getElementById("nextImage");

      let spots = [];
      let currentImages = [];
      let currentImageIndex = 0;

      function firstValue(obj, keys, fallback = "") {
        for (const key of keys) {
          const value = obj?.[key];
          if (value !== undefined && value !== null && value !== "")
            return value;
        }
        return fallback;
      }

      function spotName(data) {
        return String(
          firstValue(
            data,
            ["name", "title", "spotName", "spot_name", "locationName"],
            "Unnamed spot",
          ),
        );
      }

      function spotType(data) {
        return String(
          firstValue(
            data,
            ["type", "category", "spotType", "spot_type"],
            "other",
          ),
        );
      }

      function spotCity(data) {
        return String(
          firstValue(
            data,
            ["city", "municipality", "region", "place", "location"],
            "",
          ),
        );
      }

      function spotDescription(data) {
        return String(
          firstValue(data, ["description", "desc", "text", "caption"], ""),
        );
      }

      function spotRating(data) {
        const value = firstValue(
          data,
          ["rating", "averageRating", "avgRating", "ratingAverage"],
          "",
        );
        return value === "" ? null : Number(value);
      }

      function spotCreatedAt(data) {
        const value = firstValue(
          data,
          ["createdAt", "created_at", "timestamp", "date"],
          null,
        );

        if (!value) return null;
        if (typeof value?.toDate === "function") return value.toDate();
        if (value instanceof Date) return value;

        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }

      function spotImages(data) {
        const found = [];

        const arrayFields = [
          "images",
          "photos",
          "imageUrls",
          "photoUrls",
          "pictures",
        ];

        for (const key of arrayFields) {
          const value = data?.[key];
          if (Array.isArray(value)) {
            for (const item of value) {
              if (typeof item === "string" && item.trim())
                found.push(item.trim());
              else if (item && typeof item === "object") {
                const url =
                  item.url || item.src || item.downloadURL || item.imageUrl;
                if (url) found.push(url);
              }
            }
          }
        }

        const singleFields = [
          "image",
          "photo",
          "imageUrl",
          "photoUrl",
          "picture",
          "thumbnail",
          "coverImage",
        ];

        for (const key of singleFields) {
          const value = data?.[key];
          if (typeof value === "string" && value.trim())
            found.push(value.trim());
        }

        return [...new Set(found)];
      }

      function escapeHtml(value = "") {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(date) {
        if (!date) return "";
        return new Intl.DateTimeFormat("en-GB", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(date);
      }

      function normalize(doc) {
        const data = doc.data();

        return {
          id: doc.id,
          raw: data,
          name: spotName(data),
          type: spotType(data),
          city: spotCity(data),
          description: spotDescription(data),
          rating: spotRating(data),
          createdAt: spotCreatedAt(data),
          images: spotImages(data),
        };
      }

      function buildTypeFilter() {
        const types = [
          ...new Set(spots.map((s) => s.type).filter(Boolean)),
        ].sort((a, b) => a.localeCompare(b));

        typeFilter.innerHTML = '<option value="">All types</option>';

        for (const type of types) {
          const option = document.createElement("option");
          option.value = type;
          option.textContent = type;
          typeFilter.appendChild(option);
        }
      }

      function render() {
        const q = search.value.trim().toLowerCase();
        const type = typeFilter.value;

        let filtered = spots.filter((spot) => {
          if (type && spot.type !== type) return false;

          if (!q) return true;

          return [spot.name, spot.id, spot.type, spot.city, spot.description]
            .join(" ")
            .toLowerCase()
            .includes(q);
        });

        filtered.sort((a, b) => {
          switch (sortSelect.value) {
            case "newest":
              return (
                (b.createdAt?.getTime() || 0) - (a.createdAt?.getTime() || 0)
              );
            case "oldest":
              return (
                (a.createdAt?.getTime() || 0) - (b.createdAt?.getTime() || 0)
              );
            case "rating":
              return (b.rating ?? -1) - (a.rating ?? -1);
            default:
              return a.name.localeCompare(b.name);
          }
        });

        visibleCount.textContent = filtered.length;

        if (!filtered.length) {
          grid.innerHTML = '<div class="empty">No spots found.</div>';
          return;
        }

        grid.innerHTML = filtered
          .map((spot) => {
            const firstImage = spot.images[0];
            const imageHtml = firstImage
              ? `
            <img src="${escapeHtml(firstImage)}" alt="${escapeHtml(spot.name)}" loading="lazy">
            ${spot.images.length > 1 ? `<div class="photo-count">${spot.images.length} photos</div>` : ""}
          `
              : `<div class="no-photo">No photo</div>`;

            const meta = [
              spot.city ? `<span>${escapeHtml(spot.city)}</span>` : "",
              spot.rating !== null && !Number.isNaN(spot.rating)
                ? `<span>★ ${spot.rating.toFixed(1)}</span>`
                : "",
              spot.createdAt
                ? `<span>${formatDate(spot.createdAt)}</span>`
                : "",
            ]
              .filter(Boolean)
              .join("");

            return `
          <article class="card">
            <div class="photo"
                 data-id="${escapeHtml(spot.id)}">
              ${imageHtml}
            </div>

            <div class="body">
              <div class="top">
                <h2 class="spot-name">${escapeHtml(spot.name)}</h2>
                <div class="type">${escapeHtml(spot.type)}</div>
              </div>

              <div class="description">
                ${escapeHtml(spot.description || "No description")}
              </div>

              <div class="idbox">
                <div class="id" title="${escapeHtml(spot.id)}">${escapeHtml(spot.id)}</div>
                <button class="copy" data-copy="${escapeHtml(spot.id)}">COPY ID</button>
              </div>

              ${meta ? `<div class="meta">${meta}</div>` : ""}
            </div>
          </article>
        `;
          })
          .join("");
      }

      function openViewer(spot) {
        if (!spot.images.length) return;

        currentImages = spot.images;
        currentImageIndex = 0;
        viewerImage.src = currentImages[currentImageIndex];

        const showNav = currentImages.length > 1;
        prevImage.style.display = showNav ? "" : "none";
        nextImage.style.display = showNav ? "" : "none";

        viewerDialog.showModal();
      }

      function showImage(index) {
        if (!currentImages.length) return;

        currentImageIndex =
          (index + currentImages.length) % currentImages.length;

        viewerImage.src = currentImages[currentImageIndex];
      }

      grid.addEventListener("click", async (event) => {
        const copyButton = event.target.closest(".copy");

        if (copyButton) {
          const id = copyButton.dataset.copy;

          try {
            await navigator.clipboard.writeText(id);
            const old = copyButton.textContent;
            copyButton.textContent = "COPIED";
            setTimeout(() => (copyButton.textContent = old), 900);
          } catch {
            prompt("Copy this ID:", id);
          }

          return;
        }

        const photo = event.target.closest(".photo");
        if (!photo) return;

        const spot = spots.find((s) => s.id === photo.dataset.id);
        if (spot) openViewer(spot);
      });

      closeViewer.addEventListener("click", () => viewerDialog.close());
      prevImage.addEventListener("click", () =>
        showImage(currentImageIndex - 1),
      );
      nextImage.addEventListener("click", () =>
        showImage(currentImageIndex + 1),
      );

      viewerDialog.addEventListener("click", (event) => {
        if (event.target === viewerDialog) viewerDialog.close();
      });

      document.addEventListener("keydown", (event) => {
        if (!viewerDialog.open) return;
        if (event.key === "ArrowLeft") showImage(currentImageIndex - 1);
        if (event.key === "ArrowRight") showImage(currentImageIndex + 1);
      });

      search.addEventListener("input", render);
      typeFilter.addEventListener("change", render);
      sortSelect.addEventListener("change", render);

      async function loadSpots() {
        try {
          const snapshot = await getDocs(collection(db, "spots"));
          spots = snapshot.docs.map(normalize);
          buildTypeFilter();
          render();
        } catch (error) {
          console.error(error);
          grid.innerHTML = `
          <div class="error">
            Could not load spots.<br><br>
            ${escapeHtml(error.message)}
          </div>
        `;
        }
      }

      loadSpots();
    </script>
  </body>
</html>
